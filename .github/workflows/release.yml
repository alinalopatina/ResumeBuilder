# Выпуск версии (лаба 10.1, задание 3.2). Запускается, когда в репозиторий отправлен тег:
#   git tag v1.2.0
#   git push origin v1.2.0
# Собирает портативный zip и установщик и публикует их на странице Releases.
name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Версия из тега
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Тесты
        run: dotnet test tests/ResumeBuilder.Tests -c Release --logger GitHubActions

      - name: Установка Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Сборка дистрибутива (zip + установщик)
        shell: pwsh
        run: ./build/publish.ps1 -Version $env:VERSION

      - name: Публикация выпуска
        uses: softprops/action-gh-release@v2
        with:
          name: ResumeBuilder ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
