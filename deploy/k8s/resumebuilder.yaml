# Развёртывание в Kubernetes (лаба 10.3, модуль 3) — например, в Kubernetes из Docker Desktop.
#   docker build -f src/ResumeBuilder.Api/Dockerfile -t resumebuilder-api:1.2.0 .
#   kubectl apply -f deploy/k8s/resumebuilder.yaml
#   kubectl -n resumebuilder get pods
#   kubectl -n resumebuilder scale deployment api --replicas=5
#   kubectl -n resumebuilder set image deployment/api api=resumebuilder-api:1.2.1   — rolling update
#   kubectl -n resumebuilder rollout status deployment/api
#   kubectl -n resumebuilder rollout undo deployment/api                             — откат
#   kubectl delete namespace resumebuilder
# Служба доступна на http://localhost:30080/swagger
apiVersion: v1
kind: Namespace
metadata:
  name: resumebuilder
---
# Настройки — отдельно от образа
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: resumebuilder
data:
  App__DefaultLanguage: "ru-RU"
  App__QrPixelsPerModule: "8"
  ConnectionStrings__Redis: "cache:6379"
---
# Секреты — отдельно от настроек (в реальном проекте не хранятся в Git)
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: resumebuilder
type: Opaque
stringData:
  POSTGRES_PASSWORD: "resume_dev"
  ConnectionStrings__Postgres: "Host=db;Database=resumes;Username=resume;Password=resume_dev"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: resumebuilder
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: resumebuilder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: resumes }
            - { name: POSTGRES_USER, value: resume }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [ "pg_isready", "-U", "resume", "-d", "resumes" ]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: resumebuilder
spec:
  selector: { app: db }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: resumebuilder
spec:
  replicas: 1
  selector:
    matchLabels: { app: cache }
  template:
    metadata:
      labels: { app: cache }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: resumebuilder
spec:
  selector: { app: cache }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: resumebuilder
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # при обновлении все старые реплики работают, пока новые не готовы
      maxSurge: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: resumebuilder-api:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: db-secret }
          readinessProbe:              # принимать запросы, только когда служба готова
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:               # перезапустить контейнер, если «завис»
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
# Балансировщик: распределяет запросы между репликами api
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: resumebuilder
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
